version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "@vitest/*"
          - "@playwright/*"
        exclude-patterns:
          - "@types/three"
      # three.js and its React bindings/types must move together.
      three:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
    ignore:
      # Next.js majors need a coordinated migration (see AGENTS.md).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /visuals
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    target-branch: main

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: main
