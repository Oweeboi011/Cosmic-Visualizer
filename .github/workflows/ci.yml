name: CI

# The active gate. The same steps are mirrored (disabled) in .azuredevops/pipelines/ci-cd.yml.
# What each step checks and why: docs/solution-plan/quality-harness.md

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (static checks, unit/component/integration tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lint → typecheck → architecture → duplication → dead code → secrets → tests + coverage
      - name: Verify
        run: npm run verify

      - name: Performance budgets
        run: npm run test:perf

      - name: Build
        run: npm run build
        env:
          # Optional: without it the app uses NASA's rate-limited DEMO_KEY.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # visuals/ is a standalone prototype (ADR-0008): typecheck + prod audit only, no app harness.
  visuals:
    name: Visuals prototype (typecheck, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visuals
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visuals/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
