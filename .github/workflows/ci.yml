name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `next typegen` first: tsc needs the generated route types (e.g. LayoutProps).
      - name: Type check
        run: npm run typecheck

      # Fails if coverage drops below the thresholds in vitest.config.mts.
      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Optional: without it the app uses NASA's rate-limited DEMO_KEY.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
